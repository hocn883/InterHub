<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>

    <link
            rel="stylesheet"
            th:href="@{/css/admin/login.css}">
</head>

<body>

<div class="login-page">

    <div class="login-box">

        <div class="login-header">
            <h2>Admin Login</h2>
            <p>Đăng nhập vào hệ thống quản trị InterHub</p>
        </div>

        <!-- Sai tài khoản hoặc mật khẩu -->
        <div
                class="alert alert-error"
                th:if="${param.error}"
        >
            Sai tên đăng nhập hoặc mật khẩu
        </div>

        <!-- Logout thành công -->
        <div
                class="alert alert-success"
                th:if="${param.logout}"
        >
            Đã đăng xuất thành công
        </div>

        <form
                th:action="@{/admin/login}"
                method="post"
        >

            <div class="form-group">

                <label for="username">
                    Tên đăng nhập
                </label>

                <input
                        id="username"
                        type="text"
                        name="username"
                        placeholder="Nhập tên đăng nhập"
                        required
                        autofocus
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Mật khẩu
                </label>

                <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Nhập mật khẩu"
                        required
                >

            </div>

            <button
                    class="login-button"
                    type="submit"
            >
                Đăng nhập
            </button>

        </form>

        <div class="login-footer">
            <span>InterHub Administration</span>
        </div>

    </div>

</div>

</body>
</html>
