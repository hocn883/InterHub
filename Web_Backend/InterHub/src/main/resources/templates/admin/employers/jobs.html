<!DOCTYPE html>

<html
        lang="vi"
        xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <title>
        Job của nhà tuyển dụng
    </title>

</head>


<body>


<a
        th:href="@{/admin/employers/{id}(id=${employer.id})}">

    ← Quay lại nhà tuyển dụng

</a>


<h1>

    Job của

    <span th:text="${employer.companyName}">
    </span>

</h1>


<p>

    Tổng:

    <strong th:text="${totalItems}">
        0
    </strong>

    Job

</p>


<table border="1">


    <thead>

    <tr>

        <th>ID</th>

        <th>Tiêu đề</th>

        <th>Địa điểm</th>

        <th>Lương</th>

        <th>Số lượng</th>

        <th>Trạng thái</th>

        <th>Ngày tạo</th>

    </tr>

    </thead>


    <tbody>


    <tr th:each="job : ${jobs}">


        <td th:text="${job.id}">
        </td>


        <td th:text="${job.title}">
        </td>


        <td th:text="${job.location}">
        </td>


        <td th:text="${job.salary}">
        </td>


        <td th:text="${job.quantity}">
        </td>


        <td th:text="${job.status}">
        </td>


        <td th:text="${job.createdDate}">
        </td>


    </tr>


    <tr th:if="${#lists.isEmpty(jobs)}">

        <td
                colspan="7"
                style="text-align:center">

            Nhà tuyển dụng chưa đăng Job nào.

        </td>

    </tr>


    </tbody>


</table>


<div th:if="${totalPages > 0}">


    <a
            th:if="${currentPage > 0}"
            th:href="@{/admin/employers/{id}/jobs(
                id=${employer.id},
                page=${currentPage - 1},
                size=${pageSize}
            )}">

        Trước

    </a>


    <a
            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            th:href="@{/admin/employers/{id}/jobs(
                id=${employer.id},
                page=${i},
                size=${pageSize}
            )}"
            th:text="${i + 1}">

    </a>


    <a
            th:if="${currentPage + 1 < totalPages}"
            th:href="@{/admin/employers/{id}/jobs(
                id=${employer.id},
                page=${currentPage + 1},
                size=${pageSize}
            )}">

        Sau

    </a>


</div>


</body>

</html>
